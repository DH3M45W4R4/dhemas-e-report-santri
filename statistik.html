<!DOCTYPE html>
<html lang="en" data-bs-theme="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Report</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
</head>
<body class="body">

    <nav class="navbar topbar px-4">
        <span class="navbar-brand text-white fw-bold">
            E-Report <span class="brand-light">Santri</span> 
        </span>
        <div class="admin-profile">
            <div>
                <span>Admin</span>
                <small>Pengelola sistem</small>
            </div>
            <div class="admin-avatar">AD</div>
        </div>
    </nav>
    <div class="row">
        <aside class="sidebar col-lg-2 p-4">
            <h5 class="menu-label">Menu</h5>
            <a href="dashboard.html" class="menu-link"> <i class="bi bi-bar-chart"></i> Dashboard</a>
            <a href="statistik.html" class="menu-link active"><i class="bi bi-clipboard-data"></i> Data Laporan</a>
            <a href="settings.html" class="menu-link"> <i class="bi bi-gear"></i> Pengaturan</a>
        </aside>
        <main class="col-lg-10 p-4">
            <h2>Data Laporan Statistik</h2>
            <div class="row">
              <div class="col-lg-8">
                <div class="card">
                  <div class="card-body">
                    <h5>Statistik Laporan</h5>
                    <p>Jumlah laporan santri setiap bulan</p>
                    <div class="area-grafik">
                      <canvas id="santriChart"></canvas>
                    </div>
                  </div>
                </div>
              </div>
              <div class="col-lg-4">
                <div class="card">
                  <div class="card-body">
                    <h5>Status Laporan</h5>
                    <p>Laporan Santri</p>
                   <canvas id="statusChart"></canvas>
                  </div>
                </div>
              </div>
            </div>
        </main>
    </div>
    
    <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
      const ctx = document.getElementById('santriChart').getContext("2d")
      new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ["Januari", "Februari", "Maret", "April", "Mei", 
          // "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"
          ],
          datasets: [{
            label: "jumlah laporan per-bulan",
            data: [6,7,6,7,10,13,11,15,10,4,6,10],
            backgroundColor: [
              "royalblue",
              "red",
              "gold",
              "green",
              "lightblue",
              // "cyan",
              // "lightcyan",
              // "darkred",
              // "greenyellow",
              // "indigo",
              // "purple",
              // "midnightblue",
            ],
            borderWidth: 1,
          }] 
        },
        options:{
          plugins: {
            legend:{
              position: "bottom"
            }
          }
        }
      })
      const status = document.getElementById('statusChart').getContext("2d")
      new Chart(status, {
        type: 'pie',
        data: {
          labels: ["Accepted!","Pending...","Declined."
          ],
          datasets: [{
            label: "Status",
            data: [24,30,10],
            backgroundColor: [
              "green",
              "gold",
              "red",
              // "green",
              // "lightblue",
              // "cyan",
              // "lightcyan",
              // "darkred",
              // "greenyellow",
              // "indigo",
              // "purple",
              // "midnightblue",
            ],
            borderWidth: 1,
          }] 
        },
        options:{
          plugins: {
            legend:{
              position: "bottom"
            }
          }
        }
      })
    </script>
 
</body>
</html>
